name: CI

on:
  push:
    branches: [ "1.0.X" ]
  pull_request:
    branches: [ "1.0.X" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrumgraph
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: scrumgraph/pom.xml

      # The Maven wrapper in the repo is old, so use the runner's Maven.
      - name: Run tests
        run: mvn -B -ntp test

      - name: Coverage summary
        run: |
          awk -F, 'NR > 1 { missed += $8; covered += $9 }
            END { printf "Line coverage: %.1f%% (%d of %d lines)\n", 100 * covered / (missed + covered), covered, missed + covered }' \
            target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"
